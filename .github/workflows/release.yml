name: macOS release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check parsers
        run: |
          ./Tests/check-parser.sh
          ./Tests/check-transpose.sh
      - name: Build and package Apple Silicon app
        run: |
          ./build-app.sh
          codesign --force --deep --sign - WorshipFlow.app
          codesign --verify --deep --strict WorshipFlow.app
          mkdir -p dist
          ARCHIVE="WorshipFlow-${GITHUB_REF_NAME#v}-macOS-AppleSilicon.zip"
          ditto -c -k --sequesterRsrc --keepParent WorshipFlow.app "dist/$ARCHIVE"
          cd dist
          shasum -a 256 "$ARCHIVE" > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --title "WorshipFlow ${GITHUB_REF_NAME#v} — macOS Preview" --notes-file RELEASE_NOTES.md --prerelease --verify-tag
