name: macOS release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.2
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check parsers
        run: |
          ./Tests/check-parser.sh
          ./Tests/check-transpose.sh
      - name: Build and package Apple Silicon app
        run: |
          ./build-app.sh
          codesign --force --deep --sign - WorshipFlow.app
          codesign --verify --deep --strict WorshipFlow.app
          mkdir -p dist
          ARCHIVE="WorshipFlow-${RELEASE_TAG#v}-macOS-AppleSilicon.zip"
          ditto -c -k --sequesterRsrc --keepParent WorshipFlow.app "dist/$ARCHIVE"
          cd dist
          shasum -a 256 "$ARCHIVE" > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --title "WorshipFlow ${RELEASE_TAG#v} — macOS Preview" --notes-file RELEASE_NOTES.md --prerelease --verify-tag
